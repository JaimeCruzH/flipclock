; =============================================================================
;  Reloj flip fotorrealista - Elecrow 3.5" ESP32-S3 Display (320x480, ST77922)
; =============================================================================
;
;  La copia de LVGL 9.5.0 vive en vendor/lvgl9 y NO esta en el repositorio:
;  se descarga con `python tools/setup_lvgl.py`, que ademas le coloca el
;  library.json parcheado (srcDir "." + srcFilter), sin el cual no compilan
;  los fuentes de la libreria.
;
;  Toolchain: core Arduino 3.2.1 / IDF 5.4.2, que es el que documenta Elecrow.
;
;  Ajusta upload_port / monitor_port a tu puerto COM.
;
;  En Windows tras un proxy TLS: compilar SIEMPRE desde PowerShell, nunca desde
;  Git Bash, y con PIP_CERT / SSL_CERT_FILE / REQUESTS_CA_BUNDLE apuntando al
;  CA bundle corporativo (si no, PlatformIO no puede descargar el toolchain).
; =============================================================================

[env:esp32-s3-display]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

upload_port = COM8
monitor_port = COM8
monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_cpu = 240000000L
board_build.partitions = default_16MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE      ; lv_conf.h vive en src/, junto al codigo
    -I$PROJECT_SRC_DIR            ; ...y la v9 no lo encuentra sin este -I

; Los ~1,9 MB de sprites se embeben con .incbin desde src/assets/flip_assets.S,
; que referencia el .bin por ruta relativa a la raiz del proyecto.
build_src_flags =
    -Wa,-I$PROJECT_DIR

lib_deps = symlink://./vendor/lvgl9

[env:esp32-s3-night-bench]
extends = env:esp32-s3-display
build_flags =
    ${env:esp32-s3-display.build_flags}
    -DNIGHT_TTF_BENCHMARK=1

[env:esp32-s3-night-tiny]
extends = env:esp32-s3-night-bench
build_flags =
    ${env:esp32-s3-night-bench.build_flags}
    -DNIGHT_TTF_USE=1
    -DLV_USE_TINY_TTF=1
