<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">Pantalla de clima del flipclock</title>
  <desc id="desc">Vista representativa de la pantalla de clima con temperatura actual, condición y pronóstico horario.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f79c4"/>
      <stop offset="1" stop-color="#b0cee8"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" rx="14" fill="url(#sky)"/>
  <g fill="#fff" font-family="Arial, sans-serif">
    <text x="22" y="38" font-size="22">VITACURA</text>
    <text x="22" y="105" font-size="56">25°</text>
    <text x="22" y="138" font-size="20">Despejado</text>
