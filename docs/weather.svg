      <text x="278" y="210">22 h</text><text x="354" y="210">23 h</text><text x="430" y="210">00 h</text>
    </g>
    <g fill="#fff" font-size="28">
      <text x="50" y="248">☾</text><text x="126" y="248">☾</text><text x="202" y="248">☁</text>
      <text x="278" y="248">☾</text><text x="354" y="248">☾</text><text x="430" y="248">☾</text>
    </g>
    <g fill="#fff" font-size="18">
